name: Build iOS IPA (Free)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Full Native iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          # Install base dependencies
          npm install --legacy-peer-deps
          # Install platform-specific Rolldown native bindings for macOS runners
          npm install --legacy-peer-deps @rolldown/binding-darwin-arm64 @rolldown/binding-darwin-x64 || true
          # Install Capacitor iOS packages
          npm install --legacy-peer-deps @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest

      - name: Build Web App
        run: |
          npx vite build

      - name: Initialize & Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Build Native iOS App (xcodebuild)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package into Native .ipa
        run: |
          mkdir -p ipa_build/Payload
          APP_PATH=$(find ios/App -type d -name "App.app" | grep "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/App -type d -name "App.app" | head -n 1)
          fi
          echo "Found compiled App.app at: $APP_PATH"
          cp -R "$APP_PATH" ipa_build/Payload/
          cd ipa_build
          zip -r -q ../MicroSpends-Full.ipa Payload
          cd ..
          ls -lh MicroSpends-Full.ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroSpends-Full-IPA
          path: MicroSpends-Full.ipa
          retention-days: 14
