name: Build iOS IPA (Free)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Full Native iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Native Bindings
        run: |
          # 1. Remove Linux lockfile so npm installs macOS native binaries
          rm -f package-lock.json

          # 2. Install base dependencies
          npm install --legacy-peer-deps

          # 3. Explicitly install macOS native bindings for Tailwind Oxide & Rolldown
          npm install --legacy-peer-deps @tailwindcss/oxide-darwin-arm64 @rolldown/binding-darwin-arm64 || true

          # 4. Install Capacitor iOS toolchain
          npm install --legacy-peer-deps @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest

      - name: 1. Build Web App (Vite Dist)
        run: |
          npx vite build

      - name: 2. Initialize & Sync Capacitor iOS
        run: |
          # Ensure fresh clean iOS project setup
          if [ ! -d "ios/App" ]; then
            rm -rf ios
            npx cap add ios
          fi
          npx cap sync ios

          # If App.xcworkspace is missing, run pod install to generate it
          if [ ! -d "ios/App/App.xcworkspace" ] && [ -f "ios/App/Podfile" ]; then
            echo "Generating App.xcworkspace via pod install..."
            cd ios/App
            pod install || true
            cd ../..
          fi

          echo "Listing generated files in ios/App:"
          ls -la ios/App

      - name: 3. Build & Archive Native iOS App
        run: |
          # Select workspace if available, otherwise fallback to xcodeproj
          if [ -d "ios/App/App.xcworkspace" ]; then
            BUILD_TARGET="-workspace ios/App/App.xcworkspace"
          elif [ -d "ios/App/App.xcodeproj" ]; then
            BUILD_TARGET="-project ios/App/App.xcodeproj"
          else
            echo "Error: No Xcode workspace or project found in ios/App!"
            find ios -maxdepth 3 || true
            exit 1
          fi

          echo "Building & Archiving using: $BUILD_TARGET"

          # 1. Attempt official Xcode Archive for 100% compliant iOS bundle
          xcodebuild \
            $BUILD_TARGET \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive || {
              echo "Archive failed, falling back to xcodebuild build..."
              xcodebuild \
                $BUILD_TARGET \
                -scheme App \
                -sdk iphoneos \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -derivedDataPath build \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                clean build
            }

      - name: 4. Package into Native .IPA (with Symbols & Frameworks)
        run: |
          mkdir -p ipa_build/Payload

          # Locate App.app: check official xcarchive first, then local build, then DerivedData
          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            APP_PATH="build/App.xcarchive/Products/Applications/App.app"
          else
            APP_PATH=$(find build -name "App.app" -type d | grep "Release-iphoneos" | head -n 1)
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find build -name "App.app" -type d | head -n 1)
            fi
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | grep "Release-iphoneos" | head -n 1)
            fi
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | head -n 1)
            fi
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: App.app was not found!"
            find build -maxdepth 4 || true
            exit 1
          fi

          echo "=========================================="
          echo "Found compiled native App.app at: $APP_PATH"
          echo "=========================================="
          ls -lh "$APP_PATH"
          echo "---"
          file "$APP_PATH/App" || true
          echo "---"
          du -sh "$APP_PATH"
          echo "=========================================="

          # Copy App.app into Payload folder
          cp -R "$APP_PATH" ipa_build/Payload/

          # Include dSYMs symbol maps if present to produce complete 20MB-30MB development bundle
          if [ -d "build/App.xcarchive/dSYMs" ]; then
            cp -R build/App.xcarchive/dSYMs ipa_build/
          elif [ -d "build/dSYMs" ]; then
            cp -R build/dSYMs ipa_build/
          fi

          cd ipa_build
          zip -r -q ../MicroSpends-Full.ipa Payload dSYMs 2>/dev/null || zip -r -q ../MicroSpends-Full.ipa Payload
          cd ..
          
          echo "=========================================="
          echo "Final Native .IPA Package Size:"
          ls -lh MicroSpends-Full.ipa
          echo "=========================================="

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroSpends-Full-IPA
          path: MicroSpends-Full.ipa
          retention-days: 14
